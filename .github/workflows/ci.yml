name: WP XP Core CI
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      release_version:
        type: string
        required: true
permissions:
  contents: read
jobs:
  verify:
    # Keep the pinned Playwright browser on its supported runner OS.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.2', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned development tools
        run: |
          npm ci --ignore-scripts
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
      # Check committed generated assets before any command can rebuild them.
      - name: Check formatting and generated resource hashes
        run: npm run format:check
      - name: Rebuild browser assets
        run: npm run build
      - name: Check PHP syntax
        run: git ls-files '*.php' -z | xargs -0 -n1 php -l
      - name: Run basic feature fixtures
        run: npm test
      - name: Install pinned Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run frontend regressions
        run: npm run test:frontend
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wp-xp-core-browser-failures-${{ matrix.php }}-${{ inputs.source_sha || github.sha }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
      - name: Build and verify immutable installation bundle
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          npm run package
          npm run package:check
          node tools/check-publication.cjs
      - name: Upload ZIP, checksum, external manifest and validation proof
        if: matrix.php == '8.2'
        uses: actions/upload-artifact@v4
        with:
          name: wp-xp-core-release-${{ inputs.source_sha || github.sha }}
          path: |
            dist/wp-xp-core-*.zip
            dist/wp-xp-core-*.zip.sha256
            dist/wp-xp-core-*.manifest.json
            dist/release-notes.md
            dist/release-validation.json
          if-no-files-found: error

  wordpress:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.0'
            wordpress: '6.0'
          - php: '8.0'
            wordpress: '6.8.3'
          - php: '8.2'
            wordpress: '6.8.3'
          - php: '8.5'
            wordpress: '7.1.3'
            bbpress_version: '2.6.21'
            companion_version: '1.12.0'
            companion_sha256: '628a2844bb6369d249057fbac44a835e4a9f617123e087ac6f58238802c3d0c2'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psynthetic-ci-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, dom
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned WP-CLI
        run: curl --fail --location --output /tmp/wp-cli.phar https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
      - name: Run fresh WordPress installation, panel and concurrent reward regressions
        env:
          WP_XP_TEST_DATABASE: wp_xp_core_ci
          WP_XP_TEST_DB_HOST: 127.0.0.1:3306
          WP_XP_TEST_DB_USER: root
          WP_XP_TEST_DB_PASSWORD: synthetic-ci-password
          BBPRESS_VERSION: ${{ matrix.bbpress_version || '' }}
          WORDPRESS_VERSION: ${{ matrix.wordpress }}
          COMPANION_VERSION: ${{ matrix.companion_version || '' }}
          COMPANION_SHA256: ${{ matrix.companion_sha256 || '' }}
        run: |
          args=(--wp-cli /tmp/wp-cli.phar --lab /tmp/wp-xp-core-ci --core-version "$WORDPRESS_VERSION")
          if [ -n "$BBPRESS_VERSION" ]; then
            args+=(--bbpress-version "$BBPRESS_VERSION")
          fi
          if [ -n "$COMPANION_VERSION" ]; then
            args+=(--companion-version "$COMPANION_VERSION" --companion-sha256 "$COMPANION_SHA256")
          fi
          python3 tools/wp-integration.py "${args[@]}"
      - name: Preserve synthetic WordPress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-xp-core-wordpress-${{ matrix.wordpress }}-${{ matrix.php }}-${{ inputs.source_sha || github.sha }}
          path: /tmp/wp-xp-core-ci/results.json
          if-no-files-found: ignore

  upgrade:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.4.1'
            sha256: '602202444c8a87bc5e02463c21cbd8fc35e9fc9e8d66c18a82f7eb9ce891ac94'
          - version: '2.0.0-rc.3'
            sha256: 'd0992608def9587e43a04fe3f11c5c4a102cf755a2f10f0ebecfbed17778ad23'
          - version: '2.0.1'
            sha256: '30f78600c50d0ae51c6d1ca97b0d111aabb4df340729fd88dcf800a6d8d0a4a3'
          - version: '2.1.0-rc.2'
            sha256: '5fd72040aa004df38030ba0ce9cf043c31508c42fe6c38f8b6a91fc48120f11d'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: synthetic-ci-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -psynthetic-ci-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, dom
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned CLI and immutable official old release
        env:
          OLD_VERSION: ${{ matrix.version }}
        run: |
          curl --fail --location --output /tmp/wp-cli.phar https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          curl --fail --location --output /tmp/wp-xp-core-old.zip "https://github.com/wzf2000/wp-xp-core/releases/download/v${OLD_VERSION}/wp-xp-core-${OLD_VERSION}.zip"
      - name: Verify old release and run isolated code-only upgrade
        env:
          WP_XP_TEST_DATABASE: wp_xp_core_ci
          WP_XP_TEST_DB_HOST: 127.0.0.1:3306
          WP_XP_TEST_DB_USER: root
          WP_XP_TEST_DB_PASSWORD: synthetic-ci-password
          OLD_SHA256: ${{ matrix.sha256 }}
        run: python3 tools/wp-integration.py --wp-cli /tmp/wp-cli.phar --lab /tmp/wp-xp-core-upgrade-ci --core-version 6.8.3 --upgrade-from /tmp/wp-xp-core-old.zip --upgrade-sha256 "$OLD_SHA256"
      - name: Preserve isolated upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp-xp-core-upgrade-${{ matrix.version }}-${{ inputs.source_sha || github.sha }}
          path: /tmp/wp-xp-core-upgrade-ci/results.json
          if-no-files-found: ignore

  required:
    name: Required checks
    if: always()
    needs: [verify, wordpress, upgrade]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job to succeed
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          WORDPRESS_RESULT: ${{ needs.wordpress.result }}
          UPGRADE_RESULT: ${{ needs.upgrade.result }}
        run: test "$VERIFY_RESULT" = success && test "$WORDPRESS_RESULT" = success && test "$UPGRADE_RESULT" = success
