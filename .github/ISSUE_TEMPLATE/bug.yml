name: 问题反馈 / Bug report
description: 提交可复现的问题 / Report a reproducible problem
body:
  - type: markdown
    attributes:
      value: 请勿公开安全漏洞、凭据或用户数据；安全问题请按 SECURITY.md 私下报告。Do not include credentials or personal data; report vulnerabilities privately.
  - type: input
    id: versions
    attributes:
      label: 环境版本 / Versions
      description: WordPress、PHP、WP XP Core 版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 包括最小复现步骤及配置状态，隐去域名、用户和密钥。Include minimal steps and configuration status; redact identifying data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果 / Expected and actual results
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏日志或截图 / Redacted logs or screenshots
