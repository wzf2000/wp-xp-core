name: 功能建议 / Feature request
description: 讨论使用需求与改进 / Propose an improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题 / Use case and problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为 / Proposed behavior
      description: 涉及奖励或等级时，请说明对已有用户和历史事件的预期影响。For reward or level changes, describe the expected effect on existing accounts and history.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives considered
